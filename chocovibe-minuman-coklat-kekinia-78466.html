<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>ChocoVibe – Rasakan Gelombang Coklat Kekinian</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
    --primary:#8B5E3C;      /* coklat susu */
    --accent:#FFB6C1;       /* pastel pink */
    --mint:#98FF98;         /* mint hijau */
    --gold:#D4AF37;         /* aksen emas */
    --bg:#FAFAFA;
    --text:#333;
    --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);}
a{color:inherit;text-decoration:none;}
header{
    background:#fff;display:flex;align-items:center;justify-content:space-between;
    padding:0.8rem 1.5rem;box-shadow:0 2px 4px rgba(0,0,0,.1);position:sticky;top:0;z-index:10;
}
header img{height:48px;}
nav a{margin:0 0.8rem;font-weight:600;}
.hero{
    background:linear-gradient(135deg,var(--mint),var(--accent));
    color:#fff;padding:4rem 1rem;text-align:center;position:relative;
}
.hero::after{
    content:"";position:absolute;bottom:0;left:0;width:100%;height:80px;
    background:linear-gradient(to top,var(--bg),transparent);
}
.hero img{max-width:180px;margin-bottom:1rem;}
.hero h1{font-size:2.2rem;margin-bottom:.5rem;}
.hero p{font-size:1.2rem;opacity:.9;}
section{padding:2rem 1.5rem;}
h2{font-size:1.8rem;margin-bottom:1rem;color:var(--primary);}
.product-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:1.5rem;
}
.product{
    background:#fff;padding:1rem;border-radius:var(--radius);
    box-shadow:0 2px 6px rgba(0,0,0,.07);display:flex;flex-direction:column;
}
.product img{width:100%;height:150px;object-fit:cover;border-radius:var(--radius);}
.product h3{margin:0.8rem 0 0.4rem;font-size:1.1rem;}
.product .price{font-weight:bold;color:var(--primary);margin-bottom:0.5rem;}
.product button{
    margin-top:auto;background:var(--primary);color:#fff;border:none;
    padding:0.5rem 0;border-radius:var(--radius);cursor:pointer;
}
.product button:hover{background:var(--gold);}
.cart-btn{
    position:fixed;bottom:1.5rem;right:1.5rem;background:var(--primary);
    color:#fff;padding:0.8rem 1.2rem;border:none;border-radius:50px;
    font-size:1rem;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,.2);
}
.cart-modal{
    position:fixed;top:0;right:-100%;width:320px;height:100%;
    background:#fff;box-shadow:-2px 0 8px rgba(0,0,0,.15);
    transition:right .3s ease;display:flex;flex-direction:column;
    z-index:20;
}
.cart-modal.open{right:0;}
.cart-header{padding:1rem;background:var(--primary);color:#fff;display:flex;justify-content:space-between;align-items:center;}
.cart-body{flex:1;overflow-y:auto;padding:1rem;}
.cart-item{display:flex;align-items:center;margin-bottom:1rem;}
.cart-item img{width:50px;height:50px;object-fit:cover;border-radius:var(--radius);margin-right:.8rem;}
.cart-item .info{flex:1;}
.cart-item .info h4{font-size:0.95rem;margin-bottom:0.2rem;}
.cart-item .info .price{font-size:0.9rem;color:var(--primary);}
.cart-item .qty{display:flex;align-items:center;}
.cart-item .qty button{background:none;border:none;font-size:1rem;width:24px;height:24px;cursor:pointer;}
.cart-footer{padding:1rem;border-top:1px solid #eee;}
.cart-footer .total{font-weight:bold;margin-bottom:.5rem;}
.cart-footer button{
    width:100%;background:var(--gold);border:none;color:#fff;padding:0.6rem;
    border-radius:var(--radius);cursor:pointer;font-size:1rem;
}
.modal{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
    visibility:hidden;opacity:0;transition:opacity .3s ease,visibility .3s;
    z-index:30;
}
.modal.open{visibility:visible;opacity:1;}
.modal-content{
    background:#fff;padding:2rem;border-radius:var(--radius);width:90%;max-width:400px;
    position:relative;
}
.modal-content h3{margin-bottom:1rem;text-align:center;}
.modal-content .close{
    position:absolute;top:0.5rem;right:0.5rem;background:none;border:none;
    font-size:1.2rem;cursor:pointer;
}
.tabs{display:flex;justify-content:center;margin-bottom:1rem;}
.tabs button{
    flex:1;padding:0.5rem;border:none;background:#f0f0f0;cursor:pointer;
}
.tabs button.active{background:#fff;border-bottom:2px solid var(--primary);}
form{display:flex;flex-direction:column;}
form input{margin-bottom:0.8rem;padding:0.6rem;border:1px solid #ccc;border-radius:var(--radius);}
form button{
    background:var(--primary);color:#fff;border:none;padding:0.6rem;
    border-radius:var(--radius);cursor:pointer;
}
form button:hover{background:var(--gold);}
@media(max-width:600px){
    .hero h1{font-size:1.8rem;}
    .hero p{font-size:1rem;}
}
</style>
</head>
<body>

<header>
    <img src="https://Garonghost123.github.io/ubel-client-sites-/assets/img-663687.jpg" alt="ChocoVibe Logo">
    <nav>
        <a href="#produk">Produk</a>
        <a href="javascript:void(0)" id="openAuth">Masuk / Daftar</a>
    </nav>
</header>

<section class="hero">
    <img src="https://Garonghost123.github.io/ubel-client-sites-/assets/img-663687.jpg" alt="ChocoVibe Logo">
    <h1>ChocoVibe</h1>
    <p>Rasakan Gelombang Coklat Kekinian</p>
</section>

<section id="produk">
    <h2>Katalog Produk</h2>
    <div class="product-grid" id="productGrid">
        <!-- Produk akan di‑render lewat JS -->
    </div>
</section>

<button class="cart-btn" id="cartBtn">Keranjang (0)</button>

<!-- Cart Modal -->
<div class="cart-modal" id="cartModal">
    <div class="cart-header">
        <span>Keranjang Belanja</span>
        <button id="closeCart" style="background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;">✖</button>
    </div>
    <div class="cart-body" id="cartBody">
        <!-- Item keranjang -->
    </div>
    <div class="cart-footer">
        <div class="total">Total: <span id="cartTotal">Rp 0</span></div>
        <button id="checkoutBtn">Checkout</button>
    </div>
</div>

<!-- Auth Modal (Login / Register) -->
<div class="modal" id="authModal">
    <div class="modal-content">
        <button class="close" id="closeAuth">✖</button>
        <h3>Member ChocoVibe</h3>
        <div class="tabs">
            <button class="tabBtn active" data-tab="login">Masuk</button>
            <button class="tabBtn" data-tab="register">Daftar</button>
        </div>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Masuk</button>
        </form>
        <form id="registerForm" style="display:none;">
            <input type="text" id="regName" placeholder="Nama Lengkap" required>
            <input type="email" id="regEmail" placeholder="Email" required>
            <input type="password" id="regPassword" placeholder="Password" required>
            <button type="submit">Daftar</button>
        </form>
    </div>
</div>

<script>
/* ---------- Konstanta API ---------- */
const WORKER_API_URL = "https://ubelcompanyhq.capolgaming04.workers.dev";   // Ganti dengan URL Worker Anda
const SITE_SLUG = "chocovibe-minuman-coklat-kekinia-78466";

/* ---------- Data Produk Dummy ---------- */
const PRODUCTS = [
    {id:1, name:"ChocoVibe Classic", price:25000, img:"https://images.unsplash.com/photo-1585238342028-2b5c5d2c2a5c?auto=format&fit=crop&w=400&q=80"},
    {id:2, name:"ChocoVibe Matcha", price:28000, img:"https://images.unsplash.com/photo-1589927986089-35812389d1f4?auto=format&fit=crop&w=400&q=80"},
    {id:3, name:"ChocoVibe Strawberry", price:27000, img:"https://images.unsplash.com/photo-1589302168068-964664d93dc0?auto=format&fit=crop&w=400&q=80"},
    {id:4, name:"ChocoVibe Avocado", price:30000, img:"https://images.unsplash.com/photo-1598511729709-2c4c6c9f5c5b?auto=format&fit=crop&w=400&q=80"},
    {id:5, name:"ChocoVibe Caramel", price:26000, img:"https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&w=400&q=80"},
];

/* ---------- Render Produk ---------- */
function renderProducts(){
    const grid = document.getElementById('productGrid');
    grid.innerHTML = '';
    PRODUCTS.forEach(p=>{
        const div = document.createElement('div');
        div.className='product';
        div.innerHTML=`
            <img src="${p.img}" alt="${p.name}">
            <h3>${p.name}</h3>
            <div class="price">Rp ${p.price.toLocaleString()}</div>
            <button data-id="${p.id}">Tambah ke Keranjang</button>
        `;
        grid.appendChild(div);
    });
}
renderProducts();

/* ---------- Cart Logic ---------- */
let cart = JSON.parse(localStorage.getItem('chocovibe_cart'))||[];

function saveCart(){
    localStorage.setItem('chocovibe_cart', JSON.stringify(cart));
    updateCartUI();
}
function addToCart(id){
    const prod = PRODUCTS.find(p=>p.id===id);
    if(!prod) return;
    const existing = cart.find(i=>i.id===id);
    if(existing) existing.qty++;
    else cart.push({id:prod.id, name:prod.name, price:prod.price, img:prod.img, qty:1});
    saveCart();
}
function removeFromCart(id){
    cart = cart.filter(i=>i.id!==id);
    saveCart();
}
function changeQty(id, delta){
    const item = cart.find(i=>i.id===id);
    if(!item) return;
    item.qty+=delta;
    if(item.qty<=0) removeFromCart(id);
    else saveCart();
}
function updateCartUI(){
    const btn = document.getElementById('cartBtn');
    const totalQty = cart.reduce((a,i)=>a+i.qty,0);
    btn.textContent = `Keranjang (${totalQty})`;

    const body = document.getElementById('cartBody');
    body.innerHTML='';
    let total=0;
    cart.forEach(i=>{
        total+=i.price*i.qty;
        const el=document.createElement('div');
        el.className='cart-item';
        el.innerHTML=`
            <img src="${i.img}" alt="${i.name}">
            <div class="info">
                <h4>${i.name}</h4>
                <div class="price">Rp ${(i.price*i.qty).toLocaleString()}</div>
            </div>
            <div class="qty">
                <button data-id="${i.id}" data-action="dec">−</button>
                <span>${i.qty}</span>
                <button data-id="${i.id}" data-action="inc">+</button>
            </div>
        `;
        body.appendChild(el);
    });
    document.getElementById('cartTotal').textContent = `Rp ${total.toLocaleString()}`;
}
updateCartUI();

/* ---------- Event Listeners ---------- */
document.getElementById('productGrid').addEventListener('click', e=>{
    if(e.target.tagName==='BUTTON'){
        const id = parseInt(e.target.dataset.id);
        addToCart(id);
    }
});
document.getElementById('cartBtn').addEventListener('click',()=>{document.getElementById('cartModal').classList.add('open');});
document.getElementById('closeCart').addEventListener('click',()=>{document.getElementById('cartModal').classList.remove('open');});
document.getElementById('cartBody').addEventListener('click', e=>{
    if(e.target.tagName==='BUTTON'){
        const id = parseInt(e.target.dataset.id);
        const action = e.target.dataset.action;
        changeQty(id, action==='inc'?1:-1);
    }
});

/* ---------- Auth Modal ---------- */
const authModal=document.getElementById('authModal');
document.getElementById('openAuth').addEventListener('click',()=>{authModal.classList.add('open');});
document.getElementById('closeAuth').addEventListener('click',()=>{authModal.classList.remove('open');});
document.querySelectorAll('.tabBtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
        document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('loginForm').style.display = tab==='login'?'block':'none';
        document.getElementById('registerForm').style.display = tab==='register'?'block':'none';
    });
});

/* ---------- Register ---------- */
document.getElementById('registerForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const full_name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    try{
        const res = await fetch(`${WORKER_API_URL}/api/site/register`,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({site_slug:SITE_SLUG, full_name, email, password})
        });
        const data = await res.json();
        if(res.ok){
            alert('Pendaftaran berhasil! Silakan masuk.');
            // switch to login tab
            document.querySelector('.tabBtn[data-tab="login"]').click();
        }else{
            alert(data.message||'Gagal mendaftar');
        }
    }catch(err){
        alert('Error jaringan');
    }
});

/* ---------- Login ---------- */
document.getElementById('loginForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    try{
        const res = await fetch(`${WORKER_API_URL}/api/site/login`,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({site_slug:SITE_SLUG, email, password})
        });
        const data = await res.json();
        if(res.ok){
            localStorage.setItem('chocovibe_user', JSON.stringify(data.user||{email}));
            alert('Berhasil masuk!');
            authModal.classList.remove('open');
        }else{
            alert(data.message||'Login gagal');
        }
    }catch(err){
        alert('Error jaringan');
    }
});

/* ---------- Checkout ---------- */
document.getElementById('checkoutBtn').addEventListener('click', async ()=>{
    if(cart.length===0){alert('Keranjang kosong');return;}
    const user = JSON.parse(localStorage.getItem('chocovibe_user'));
    if(!user){alert('Silakan masuk terlebih dahulu');return;}
    const items_summary = cart.map(i=>({product_id:i.id, qty:i.qty, price:i.price}));
    const total_amount = cart.reduce((a,i)=>a+i.price*i.qty,0);
    try{
        const res = await fetch(`${WORKER_API_URL}/api/site/order`,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                site_slug:SITE_SLUG,
                user_email:user.email,
                items_summary,
                total_amount
            })
        });
        const data = await res.json();
        if(res.ok){
            alert('Pesanan berhasil! Terima kasih.');
            cart=[];saveCart();
            document.getElementById('cartModal').classList.remove('open');
        }else{
            alert(data.message||'Gagal memproses pesanan');
        }
    }catch(err){
        alert('Error jaringan');
    }
});
</script>
</body>
</html>
