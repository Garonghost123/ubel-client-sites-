.ci-qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);font-weight:700}
.ci-qty button:hover{background:var(--char);color:var(--cream)}
.ci-qty b{min-width:20px;text-align:center}
.ci-remove{align-self:flex-start;color:var(--muted);font-size:1.1rem}
.ci-remove:hover{color:#c0392b}
.cart-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.cart-empty .em{font-size:3rem;margin-bottom:14px}
.drawer-foot{padding:22px 24px;border-top:1px solid var(--line);background:var(--paper-2)}
.drawer-foot .row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:.95rem}
.drawer-foot .total{font-family:'Fraunces';font-size:1.5rem;font-weight:600;margin:10px 0 16px}
.drawer-foot .total span{font-size:1rem}
.pay-hint{font-size:.78rem;color:var(--muted);text-align:center;margin-top:12px}

/* ---------- Modals ---------- */
.modal{position:fixed;inset:0;z-index:9700;display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:.35s}
.modal.open{opacity:1;visibility:visible}
.modal-box{background:var(--paper);border-radius:16px;width:min(460px,100%);max-height:92vh;overflow-y:auto;transform:translateY(24px) scale(.97);transition:transform .4s var(--ease);box-shadow:var(--shadow)}
.modal.open .modal-box{transform:translateY(0) scale(1)}
.modal-head{padding:26px 28px 0;display:flex;justify-content:space-between;align-items:flex-start}
.modal-head h3{font-size:1.7rem}
.modal-head p{color:var(--muted);font-size:.9rem;margin-top:4px}
.modal-head .x{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);font-size:1.2rem;flex:none}
.tabs{display:flex;margin:22px 28px 0;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:12px;font-weight:700;font-size:.95rem;color:var(--muted);position:relative}
.tabs button.active{color:var(--char)}
.tabs button.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--matcha-deep)}
.form{padding:24px 28px 28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:.82rem;font-weight:700;margin-bottom:7px;letter-spacing:.02em}
.field input,.field select{width:100%;padding:.8em 1em;border:1.5px solid var(--line);border-radius:10px;background:var(--paper-2);transition:.3s}
.field input:focus,.field select:focus{outline:none;border-color:var(--matcha-deep);background:#fff}
.field .err{color:#c0392b;font-size:.78rem;margin-top:5px;display:none}
.field.invalid input{border-color:#c0392b}
.field.invalid .err{display:block}
.form-msg{padding:0 28px 24px;font-size:.88rem;min-height:20px}
.form-msg.ok{color:var(--matcha-deep);font-weight:700}
.form-msg.bad{color:#c0392b;font-weight:700}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
